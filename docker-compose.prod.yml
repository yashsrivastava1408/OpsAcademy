# OpsAcademy — Production EC2 Docker Compose Architecture
#
# Usage:
#   1. Copy .env.production.example to .env.production and set secrets
#   2. Run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Profiles:
#   Add Prometheus & Grafana with:
#     docker compose -f docker-compose.prod.yml --env-file .env.production --profile observability up -d

services:
  # ── 1. Edge Reverse Proxy (Automatic TLS / SSL via Caddy) ──
  proxy:
    image: caddy:2.8-alpine
    container_name: opsacademy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
      - TLS_SNIPPET=${TLS_SNIPPET:-tls_acme}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client
      - server
    networks:
      - opsacademy-public

  # ── 2. Sandbox Container Image (Built once on host daemon) ─
  sandbox-image:
    build:
      context: ./sandbox-image
    image: opsacademy-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

  # ── 3. Frontend Client (React 19 SPA served via Nginx) ─────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL-}  # empty = same origin, via Caddy
        # Supabase sign-in. Set VITE_AUTH_MODE=supabase in .env.production at the cutover; empty = the gateway's own sign-in.
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-}
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SSO_PROVIDERS: ${VITE_SSO_PROVIDERS:-}
    container_name: opsacademy-client
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - opsacademy-public

  # ── 4. API Gateway & Sandbox Orchestrator (Node.js) ────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: opsacademy-server
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - SERVICE_ROLE=all
      - SANDBOX_MODE=docker
      - SANDBOX_IMAGE=opsacademy-sandbox:latest
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required (Supabase transaction-pooler connection string)}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      # Server-only: creates and manages Lab ID accounts in Supabase Auth. Never reaches the browser build.
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      # Cutover switch (docs/runbooks/auth-cutover.md): empty = the gateway's own sign-in, off = Supabase only.
      - LEGACY_AUTH=${LEGACY_AUTH:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CERT_SECRET=${CERT_SECRET:-}
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - AI_HUB_URL=http://ai-hub:5000
      - AI_HUB_TOKEN=${AI_HUB_TOKEN:?AI_HUB_TOKEN is required}
      - AI_HUB_TIMEOUT_MS=${AI_HUB_TIMEOUT_MS:-10000}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-OpsAcademy <noreply@opsacademy.in>}
      - APP_URL=${APP_URL:-https://${DOMAIN:-localhost}}
      - CLIENT_URL=${CLIENT_URL:-https://${DOMAIN:-localhost}}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      - SANDBOX_MAX_TOTAL=${SANDBOX_MAX_TOTAL:-45}
      # Who may start a lab: open (anyone signed in) | accounts (lab IDs only, with a queue) | slots (lab IDs, in their slot).
      - LAB_POLICY=${LAB_POLICY:-open}
      - LEARNERS_PER_SERVER=${LEARNERS_PER_SERVER:-40}
      - SANDBOX_POOL_SIZE=${SANDBOX_POOL_SIZE:-5}
      - CAMPUS_IPS=${CAMPUS_IPS:-}
      - CAMPUS_RATE_MULTIPLIER=${CAMPUS_RATE_MULTIPLIER:-15}
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-256}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-0.5}
    volumes:
      # Mount host Docker socket to manage isolated learner sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_completed_successfully
      ai-hub:
        condition: service_healthy
    networks:
      - opsacademy-public
      - opsacademy-internal

  # ── 4a. Database migrations (one-shot, before the gateway and worker start) ──
  # Applies pending supabase/migrations/*.sql under an advisory lock; a failed file rolls
  # back and stops the deploy, leaving the previous version running. Back up first
  # (docs/BACKUP_AND_RESTORE.md). Uses the direct connection when MIGRATION_DATABASE_URL is set.
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: opsacademy-migrate
    restart: "no"
    command: ["node", "scripts/migrate.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - MIGRATION_DATABASE_URL=${MIGRATION_DATABASE_URL:-}
      - MIGRATIONS_DIR=/app/migrations
    volumes:
      - ./supabase/migrations:/app/migrations:ro
    networks:
      - opsacademy-public

  # ── 4b. Worker: pruning and leaderboard refresh (one process, not one per gateway) ──
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: opsacademy-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      # The worker holds advisory locks, which need a session-mode connection (the session pooler
      # or direct string), never the transaction pooler the gateway uses. worker.js switches to this.
      - WORKER_DATABASE_URL=${WORKER_DATABASE_URL:-${MIGRATION_DATABASE_URL:-}}
      - DATABASE_POOL_SIZE=3
      - LAB_POLICY=${LAB_POLICY:-open}
      - SANDBOX_MAX_TOTAL=${SANDBOX_MAX_TOTAL:-45}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - opsacademy-public

  # ── 5. AI Mentor Hub (Python 3.11 / Flask / Gunicorn) ──────
  # Isolated network: NOT accessible from proxy or public internet
  ai-hub:
    build:
      context: ./ai-hub
      dockerfile: Dockerfile
      args:
        WITH_SEMANTIC: ${WITH_SEMANTIC:-true}
    container_name: opsacademy-ai-hub
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - AI_HUB_TOKEN=${AI_HUB_TOKEN:?AI_HUB_TOKEN is required}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - MODEL_CACHE_DIR=/opt/models
    networks:
      - opsacademy-internal

  # ── 6. Observability: Prometheus Metrics (Optional) ────────
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    container_name: opsacademy-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - opsacademy-public
      - opsacademy-internal

  # ── 7. Observability: Grafana Dashboards (Optional) ────────
  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    container_name: opsacademy-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/opsacademy.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - opsacademy-public

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  # Connects Caddy to Client SPA and API Gateway
  opsacademy-public:
    driver: bridge
  # Internal network with no external exposure: Gateway <-> AI Hub
  opsacademy-internal:
    driver: bridge
    internal: true
