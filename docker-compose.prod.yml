# OpsAcademy — Production EC2 Docker Compose Architecture
#
# Usage:
#   1. Copy .env.production.example to .env.production and set secrets
#   2. Run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Profiles:
#   Add Prometheus & Grafana with:
#     docker compose -f docker-compose.prod.yml --env-file .env.production --profile observability up -d

services:
  # ── 1. Edge Reverse Proxy (Automatic TLS / SSL via Caddy) ──
  proxy:
    image: caddy:2.8-alpine
    container_name: opsacademy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client
      - server
    networks:
      - opsacademy-public

  # ── 2. Sandbox Container Image (Built once on host daemon) ─
  sandbox-image:
    build:
      context: ./sandbox-image
    image: opsacademy-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

  # ── 3. Frontend Client (React 19 SPA served via Nginx) ─────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL-}  # empty = same origin, via Caddy
    container_name: opsacademy-client
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - opsacademy-public

  # ── 4. API Gateway & Sandbox Orchestrator (Node.js) ────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: opsacademy-server
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - SERVICE_ROLE=all
      - SANDBOX_MODE=docker
      - SANDBOX_IMAGE=opsacademy-sandbox:latest
      - STORE_DRIVER=${STORE_DRIVER:-sqlite}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CERT_SECRET=${CERT_SECRET:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - AI_HUB_URL=http://ai-hub:5000
      - AI_HUB_TOKEN=${AI_HUB_TOKEN:?AI_HUB_TOKEN is required}
      - AI_HUB_TIMEOUT_MS=${AI_HUB_TIMEOUT_MS:-10000}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-OpsAcademy <noreply@opsacademy.in>}
      - APP_URL=${APP_URL:-https://${DOMAIN:-localhost}}
      - CLIENT_URL=${CLIENT_URL:-https://${DOMAIN:-localhost}}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      - SANDBOX_MAX_TOTAL=${SANDBOX_MAX_TOTAL:-45}
      - SANDBOX_POOL_SIZE=${SANDBOX_POOL_SIZE:-5}
      - CAMPUS_IPS=${CAMPUS_IPS:-}
      - CAMPUS_RATE_MULTIPLIER=${CAMPUS_RATE_MULTIPLIER:-15}
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-256}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-0.5}
    volumes:
      - server-data:/data
      # Mount host Docker socket to manage isolated learner sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      ai-hub:
        condition: service_healthy
    networks:
      - opsacademy-public
      - opsacademy-internal

  # ── 5. AI Mentor Hub (Python 3.11 / Flask / Gunicorn) ──────
  # Isolated network: NOT accessible from proxy or public internet
  ai-hub:
    build:
      context: ./ai-hub
      dockerfile: Dockerfile
      args:
        WITH_SEMANTIC: ${WITH_SEMANTIC:-true}
    container_name: opsacademy-ai-hub
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - AI_HUB_TOKEN=${AI_HUB_TOKEN:?AI_HUB_TOKEN is required}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - MODEL_CACHE_DIR=/opt/models
    networks:
      - opsacademy-internal

  # ── 6. Observability: Prometheus Metrics (Optional) ────────
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    container_name: opsacademy-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - opsacademy-public
      - opsacademy-internal

  # ── 7. Observability: Grafana Dashboards (Optional) ────────
  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    container_name: opsacademy-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/opsacademy.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - opsacademy-public

volumes:
  server-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  # Connects Caddy to Client SPA and API Gateway
  opsacademy-public:
    driver: bridge
  # Internal network with no external exposure: Gateway <-> AI Hub
  opsacademy-internal:
    driver: bridge
    internal: true
