services:
  # ── API Gateway (Node.js Web Service) ──────────────────────
  - type: web
    name: opsacademy-server
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: PORT
        value: 4000
      - key: SANDBOX_MODE
        value: pty
      - key: JWT_SECRET
        generateValue: true
      - key: AI_HUB_URL
        fromService:
          type: web
          name: opsacademy-ai-hub
          property: host

  # ── AI Agent Hub (Python Web Service) ─────────────────────
  - type: web
    name: opsacademy-ai-hub
    env: python
    region: oregon
    plan: free
    buildCommand: cd ai-hub && pip install -r requirements.txt
    startCommand: cd ai-hub && python app.py
    envVars:
      - key: PORT
        value: 5000
