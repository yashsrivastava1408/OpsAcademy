# Render blueprint — a public demo deployment.
#
# Read before relying on it:
#  - Sandboxes here are PTY shells inside the gateway's own container (Render
#    cannot start sibling containers), so students are NOT isolated from the
#    gateway process. Fine for a demo; for untrusted users run the gateway on
#    a VM with Docker and SANDBOX_MODE=docker (see docker-compose.yml).
#  - The free plan has no persistent disk: accounts, progress and certificates
#    are lost whenever the service restarts. Attach a disk and set DATA_DIR to
#    keep them.
#  - Set CORS_ORIGINS on the gateway to your frontend's URL after the first deploy.
#  - Region: every terminal keystroke is a round trip to the gateway, so it
#    should be near the students. Singapore is the closest Render region to
#    India. Render cannot move an existing service: to change region, create
#    new services from this blueprint and point VITE_API_URL at the new URL.

envVarGroups:
  # One generated secret shared by both services, so only the gateway can call the hub.
  - name: opsacademy-shared
    envVars:
      - key: AI_HUB_TOKEN
        generateValue: true

services:
  # ── API Gateway (Node.js Web Service) ──────────────────────
  - type: web
    name: opsacademy-server
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SANDBOX_MODE
        value: pty
      - key: JWT_SECRET
        generateValue: true
      - key: AI_HUB_URL
        fromService:
          type: web
          name: opsacademy-ai-hub
          property: hostport
      - key: CORS_ORIGINS
        sync: false
      # The web app's public URL: used for the links in password-reset emails.
      - key: APP_URL
        sync: false
      # Optional. Without it reset and confirmation links are only logged.
      - key: RESEND_API_KEY
        sync: false
      # Optional. Enables the operator page at /admin.
      - key: ADMIN_TOKEN
        sync: false
      - fromGroup: opsacademy-shared

  # ── AI Agent Hub (Python Web Service) ─────────────────────
  - type: web
    name: opsacademy-ai-hub
    env: python
    region: singapore
    plan: free
    buildCommand: cd ai-hub && pip install -r requirements.txt
    startCommand: cd ai-hub && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 30 --keep-alive 15 app:app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.11.9
      # The embedding ranker needs about 450 MB more memory than the free plan
      # has. On a larger plan: add requirements-semantic.txt to the build
      # command and remove this line.
      - key: SEMANTIC_SEARCH
        value: "off"
      - fromGroup: opsacademy-shared
