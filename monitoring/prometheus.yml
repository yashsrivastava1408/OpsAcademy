global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: opsacademy-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["server:4000"]
    # If METRICS_TOKEN is set on the gateway, add:
    # authorization:
    #   credentials: <token>
