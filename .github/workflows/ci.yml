name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Jobs can read the repository and nothing else. A job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit, not a tag: a tag can be moved to
# different code after the fact, a commit cannot. Dependabot keeps them current.

jobs:
  server:
    name: Gateway lint, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Unit, API, WebSocket and real-shell (node-pty) tests. Fails if coverage
      # drops under the floor in package.json (jest.coverageThreshold).
      - run: npm run test:coverage

      - name: Validate lab content
        run: npm run labs:validate

  ai-hub:
    name: AI hub lint, tests and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-hub/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (hub and lab simulators)
        run: ruff check . ../sandbox-image

      - name: Knowledge base matches the course content
        run: python scripts/build_corpus.py --check

      - name: Tests (coverage must stay at 90% or more)
        run: python -m pytest tests -q --cov=agents --cov=app --cov=pipeline --cov-fail-under=90

      # The docker, kubectl and aws lab simulators, and every rewritten lab
      # check proven both ways (fails on an empty home, passes after the tasks).
      - name: Lab simulators and lab checks
        run: python -m pytest ../sandbox-image/tests -q

      # Fails the build if hints leak answers, retrieval or the scanner
      # regress, or stuck-student cases stop passing.
      - name: Quality gates
        run: python evals/run_eval.py --check

  client:
    name: Client lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # What ships to production only (--omit=dev). "High" and "critical"
      # fail the build; lower ones are listed by `npm audit` locally.
      - name: Audit gateway dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

      - name: Audit client dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

      - name: Audit AI hub dependencies
        run: |
          pip install --quiet pip-audit
          pip-audit -r ai-hub/requirements.txt -r ai-hub/requirements-semantic.txt

      - name: Scan the history for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfiles, Compose, Kubernetes and Terraform files checked for risky
      # settings. Reported in the log but not yet a gate: the Kubernetes
      # manifests are a demo and have known findings (see docs/THREAT_MODEL.md).
      - name: Scan infrastructure files for misconfiguration (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'

  browser-e2e:
    name: Browser walk-through
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [server, ai-hub, client]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-hub/requirements.txt

      - name: Install dependencies
        run: |
          (cd server && npm ci)
          (cd client && npm ci)
          pip install -r ai-hub/requirements.txt

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Builds the client, starts the hub and gateway, and drives a real
      # browser through the whole app, including typing on a slow connection
      # and a phone-sized screen.
      - name: Browser tests
        working-directory: client
        run: npm run e2e

      - name: Keep screenshots and server logs from a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-artifacts
          path: client/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  sandbox-e2e:
    name: Docker sandbox, image scan and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [server, ai-hub]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-hub/requirements.txt

      # The hub image normally includes an embedding model that is downloaded
      # while building. CI builds without it, so a slow or failed download of a
      # 90 MB file cannot fail the pipeline; the model has its own tests.
      - name: Build images
        run: |
          docker build -t opsacademy-sandbox:latest sandbox-image
          docker build -t opsacademy/server:ci server
          docker build -t opsacademy/ai-hub:ci --build-arg WITH_SEMANTIC=false ai-hub
          docker build -t opsacademy/client:ci client

      # Known vulnerabilities in what the images contain. Only ones that have
      # a fix available fail the build: the others cannot be acted on.
      - name: Scan the sandbox image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsacademy-sandbox:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsacademy/server:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the AI hub image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsacademy/ai-hub:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the client image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsacademy/client:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install dependencies
        run: |
          (cd server && npm ci)
          pip install -r ai-hub/requirements.txt

      # Tries to break every sandbox restriction from inside a real container.
      - name: Sandbox isolation check
        working-directory: server
        run: node scripts/docker-check.js

      # Every lab step against a fresh container: fails if a step needs a tool
      # the sandbox lacks, or if its check passes before any work is done.
      - name: Lab audit
        working-directory: server
        run: npm run labs:audit:check

      # The same simulator and lab-check tests as the AI hub job, but inside
      # the sandbox image with the gateway's restrictions (no network,
      # read-only root, no capabilities, unprivileged user).
      - name: Lab checks inside the hardened container
        run: |
          pip install --quiet --target "$RUNNER_TEMP/pytest" pytest
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 128 --memory 256m --user 1000:1000 \
            --tmpfs /home/student:rw,exec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0755 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 \
            -v "$PWD":/repo:ro -v "$RUNNER_TEMP/pytest":/deps:ro \
            -e PYTHONPATH=/deps -e PYTHONDONTWRITEBYTECODE=1 -w /home/student \
            opsacademy-sandbox:latest \
            python3 -m pytest /repo/sandbox-image/tests -q -p no:cacheprovider --basetemp=/home/student/pt

      - name: Start AI hub and gateway (Docker sandboxes)
        env:
          AI_HUB_TOKEN: ci-shared-token
        run: |
          (cd ai-hub && PORT=5005 gunicorn --bind 127.0.0.1:5005 --workers 1 --threads 8 --keep-alive 15 app:app > ../hub.log 2>&1 &)
          (cd server && SANDBOX_MODE=docker PORT=4000 AI_HUB_URL=http://127.0.0.1:5005 DATA_DIR=$RUNNER_TEMP/data node server.js > ../gateway.log 2>&1 &)
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/ready | grep -q '"status":"ready"' && exit 0
            sleep 2
          done
          cat hub.log gateway.log
          exit 1

      # A student's whole journey: terminal, lab checks, hints, certificate.
      - name: End-to-end
        working-directory: server
        run: node scripts/e2e.js http://127.0.0.1:4000

      - name: Keep the server logs from a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-e2e-logs
          path: |
            hub.log
            gateway.log
          retention-days: 7
          if-no-files-found: ignore

  # Deploys only what passed every job above, and only from main.
  # It does nothing until the hooks exist: create a Deploy Hook for each
  # service (Render: Settings > Deploy Hook; Vercel: Settings > Git > Deploy
  # Hooks), save the URLs as the repository secrets named below, and turn off
  # automatic deploys on push in Render and Vercel. Until auto-deploy is off,
  # both still deploy every push whether or not CI passed.
  deploy:
    name: Deploy (after every check passes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [server, ai-hub, client, security, browser-e2e, sandbox-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      RENDER_HUB_DEPLOY_HOOK: ${{ secrets.RENDER_HUB_DEPLOY_HOOK }}
      RENDER_GATEWAY_DEPLOY_HOOK: ${{ secrets.RENDER_GATEWAY_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Trigger the deploys
        run: |
          trigger() {
            if [ -z "$2" ]; then
              echo "$1: no deploy hook configured, skipped"
              return 0
            fi
            # The hook URL is a secret, so it is never printed.
            curl --silent --show-error --fail --max-time 30 -X POST "$2" > /dev/null
            echo "$1: deploy triggered"
          }
          # The hub first, so the gateway never starts against a hub that is older than it expects.
          trigger "AI hub" "$RENDER_HUB_DEPLOY_HOOK"
          trigger "Gateway" "$RENDER_GATEWAY_DEPLOY_HOOK"
          trigger "Client" "$VERCEL_DEPLOY_HOOK"
