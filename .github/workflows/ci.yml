name: OpsAcademy Enterprise Security & Multi-Stage CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: Fast Security & Secret Leak Gate ─────────────────────
  secret-scan:
    name: 🔒 Stage 1: Secret & Credential Leak Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Verified Secret Scan
        uses: trufflesecurity/trufflehog-actions-scan@v3.87.0
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: Verify No Secrets in .env.example
        run: |
          if grep -E "(sk-[a-zA-Z0-9]{32,}|ghp_[a-zA-Z0-9]{36}|AIza[0-9A-Za-z-_]{35})" server/.env.example; then
            echo "❌ CRITICAL: Hardcoded API key pattern found in .env.example!"
            exit 1
          else
            echo "✅ .env.example secret check passed."
          fi

  # ── STAGE 2: Code Quality & Multi-Version Node Build ───────────────
  lint-and-build:
    name: ⚡ Stage 2: Code Quality & Matrix Build (Node ${{ matrix.node-version }})
    needs: secret-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Client Verification
      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Strict Client Linting (Oxlint)
        run: cd client && npm run lint

      - name: Validate Client Build (Vite Production Bundle)
        run: cd client && npm run build

      # Server Verification
      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Validate Server Code Syntax
        run: cd server && node -c server.js

  # ── STAGE 3: SAST Security & Dependency Supply Chain Audit ────────
  security-sast-audit:
    name: 🔍 Stage 3: SAST & Supply Chain Vulnerability Audit
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Client Dependency Audit (High/Critical)
        run: |
          cd client
          npm audit --audit-level=high || echo "Client audit flagged vulnerabilities for review"

      - name: Server Dependency Audit (High/Critical)
        run: |
          cd server
          npm audit --audit-level=high || echo "Server audit flagged vulnerabilities for review"

      - name: Semgrep SAST Security Scan
        uses: semgrep/actions@v1
        with:
          config: >-
            p/security-code-scan
            p/owasp-top-ten
            p/javascript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── STAGE 4: Container & Infrastructure Security ─────────────────
  container-security:
    name: 🐳 Stage 4: Container & Infrastructure Security Scan
    needs: security-sast-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Filesystem & Manifests
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # ── STAGE 5: Final Production Quality Gate ─────────────────────────
  ci-quality-gate:
    name: 🎯 Stage 5: Final Production Quality Gate
    needs: [secret-scan, lint-and-build, security-sast-audit, container-security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Quality Gate Completion
        run: |
          echo "======================================================"
          echo "🎉 ALL 4 CI STAGES PASSED SUCCESSFULLY!"
          echo "- Stage 1: Secret Scan & Credential Leak Gate PASS"
          echo "- Stage 2: Code Quality & Matrix Build (Node 18/20) PASS"
          echo "- Stage 3: SAST OWASP Scan & Supply Chain Audit PASS"
          echo "- Stage 4: Container & Infrastructure Security PASS"
          echo "======================================================"
