apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsacademy-server
  namespace: opsacademy
  labels:
    app: opsacademy-server
spec:
  # One replica on purpose: sandbox sessions, the terminal WebSockets and the
  # JSON data store all live in this process. Scaling out needs a shared
  # store and session affinity first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opsacademy-server
  template:
    metadata:
      labels:
        app: opsacademy-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: opsacademy/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: opsacademy-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: opsacademy-secrets, key: JWT_SECRET }
            - name: AI_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: opsacademy-secrets, key: AI_HUB_TOKEN }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: opsacademy-secrets, key: ADMIN_TOKEN, optional: true }
            - name: SANDBOXES_DIR
              value: /sandboxes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sandboxes
              mountPath: /sandboxes
            - name: tmp
              mountPath: /tmp
          # Liveness: the process answers. Readiness: it can also do useful work.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opsacademy-data
        - name: sandboxes
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsacademy-data
  namespace: opsacademy
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opsacademy-server
  namespace: opsacademy
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: opsacademy-server
