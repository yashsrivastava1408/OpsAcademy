# Copy to secret.yaml, fill in real values, and apply. Do not commit secret.yaml.
#
#   kubectl -n opsacademy create secret generic opsacademy-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=AI_HUB_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: opsacademy-secrets
  namespace: opsacademy
type: Opaque
stringData:
  JWT_SECRET: "replace-me"
  AI_HUB_TOKEN: "replace-me"
  ADMIN_TOKEN: "replace-me"
  # Optional: enables the LLM mentor in the AI hub.
  # ANTHROPIC_API_KEY: ""
