# Copy to secret.yaml, fill in real values, and apply. Do not commit secret.yaml.
#
#   kubectl -n opsacademy create secret generic opsacademy-secrets \
#     --from-literal=CERT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SUPABASE_SECRET_KEY="<the project secret key>" \
#     --from-literal=AI_HUB_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=PLATFORM_ADMIN_EMAILS="you@example.com"
apiVersion: v1
kind: Secret
metadata:
  name: opsacademy-secrets
  namespace: opsacademy
type: Opaque
stringData:
  CERT_SECRET: "replace-me"
  SUPABASE_SECRET_KEY: "replace-me"
  AI_HUB_TOKEN: "replace-me"
  PLATFORM_ADMIN_EMAILS: "you@example.com"
  # Optional: enables the LLM mentor in the AI hub.
  # ANTHROPIC_API_KEY: ""
  # GROQ_API_KEY: ""
