server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # JavaScript and CSS shrink to about a third of their size on the wire.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Single-page app: unknown paths (e.g. /verify/OPS-...) are handled by the client router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vercel's analytics scripts only exist on Vercel. Answer 404 here rather
  # than the app shell, which the browser would try to run as JavaScript.
  location /_vercel/ {
    return 404;
  }

  # Hashed build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
