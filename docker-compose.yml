version: '3.8'

services:
  # ── API Gateway (Node.js) ──────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: opsacademy-server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - SANDBOX_MODE=pty
      - JWT_SECRET=opsacademy-dev-secret-key-change-in-production
      - AI_HUB_URL=http://ai-hub:5000
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - opsacademy-net

  # ── AI Agent Hub (Python / Flask) ──────────────────────────
  ai-hub:
    build:
      context: ./ai-hub
      dockerfile: Dockerfile
    container_name: opsacademy-ai-hub
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - opsacademy-net

  # ── Frontend Client (React / Vite) ─────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: opsacademy-client
    ports:
      - "5173:80"
    depends_on:
      - server
      - ai-hub
    restart: unless-stopped
    networks:
      - opsacademy-net

networks:
  opsacademy-net:
    driver: bridge
